package:
  name: soma

soma-env:
  publication: neuro-forge
  components:
    - soma-io
    - aims-free
    - aims-gpl
    - brainvisa-share

  internal-dependencies:
    - soma-base

  type: compiled

requirements:
  build:
    - sigcpp-2.0
    - libblitz
    - boost
    - gfortran
    - graphviz
    - dcmtk
    - doxygen
    - pkgconfig
    - numpy
    - pyyaml
    - $soma-env{{ pin_dev_compatible('libminc', lower_bound='x.x', upper_bound='x.x') }}
    - $soma-env{{ pin_dev_compatible('libnetcdf', lower_bound='x.x', upper_bound='x.x') }}
    - $soma-env{{ pin_dev_compatible('hdf5', lower_bound='x.x', upper_bound='x.x') }}
    - openjpeg
    - soma-openslide
    - $soma-env{{ pin_dev_compatible("qt6-main", min_pin="6.11") }}

  run:
    - sigcpp-2.0
    # - libblitz  # is it needed at runtime ??
    # - boost  # is it needed at runtime ??
    - gfortran
    - $soma-env{{ pin_dev_compatible('dcmtk', lower_bound='x.x', upper_bound='x.x') }}
    - numpy <2
    - pyyaml
    - $soma-env{{ pin_dev_compatible('libminc', lower_bound='x.x', upper_bound='x.x') }}
    - $soma-env{{ pin_dev_compatible('libnetcdf', lower_bound='x.x', upper_bound='x.x') }}
    - $soma-env{{ pin_dev_compatible('hdf5', lower_bound='x.x', upper_bound='x.x') }}
    - openjpeg
    - pywebp
    - objgraph
    - pygltflib
    - gltf-transform
    - dracopy
    - soma-openslide
    - $soma-env{{ pin_dev_compatible("qt6-main", min_pin="6.11") }}

tests:
  - script: |
      python -m soma_forge test soma
      python -m soma_forge test aims
      python -m soma_forge test axon
